# Version catalog — the ONLY place versions are declared.
# No version literals in any build.gradle.kts.
#
# This file carries what the code ACTUALLY imports, nothing more. Declaring
# Phase 2's Ktor or Phase 4's LiveKit ahead of use is the "keep it for later"
# pattern HARNESS.md §3 dimension 5 rejects: unused dependencies are dead
# weight, they inflate the APK, and they make it impossible to tell which
# libraries the app really depends on. Add each one in the commit that first
# imports it.

[versions]
agp = "9.3.1"
kotlin = "2.4.10"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
lifecycle = "2.9.4"
# Image loading for avatar photos only. App layer, never the design system — see
# DIFFERENCES.md D8.
coil = "3.4.0"
composeBom = "2026.06.01"

# test
junit = "4.13.2"
# 4.14+ is required: 4.13 caps at API 34 and refuses to run at all against a
# package with targetSdkVersion 35 ("targetSdkVersion=35 > maxSdkVersion=34").
robolectric = "4.16.1"

# Phase 2 — networking, serialization, auth
ktor = "3.5.2"
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.8.0"
supabase = "3.7.0"
kotlinxCoroutines = "1.10.2"

# Phase 4 — live video. Phase 6 — face enrollment.
livekit = "2.27.0"
mlkitFace = "16.1.7"
camerax = "1.6.1"

# Phase 7 — push. FCM, per DECISIONS.md D-016.
#
# The BOM pins firebase-messaging and everything it drags in, which matters more
# here than elsewhere: messaging pulls Play Services artifacts that version
# independently, and a mismatched set fails at runtime rather than at build time.
#
# googleServices is the Gradle plugin that turns google-services.json into the
# string resources the Firebase SDK reads at startup. It is declared here but
# applied CONDITIONALLY in app/build.gradle.kts — see the comment there.
firebaseBom = "34.17.0"
googleServices = "4.5.0"

[libraries]
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose — versions come from the BOM, so these carry no version.ref
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# test
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
# Test-only engine. Lets the endpoint tests assert the exact method, path, query
# and body that would go on the wire, without a server.
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-realtime = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
livekit-android = { group = "io.livekit", name = "livekit-android", version.ref = "livekit" }
mlkit-face-detection = { group = "com.google.mlkit", name = "face-detection", version.ref = "mlkitFace" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
# No version: the BOM above supplies it.
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
