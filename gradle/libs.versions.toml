# Version catalog — the ONLY place versions are declared.
# No version literals in any build.gradle.kts.
#
# This file carries what the code ACTUALLY imports, nothing more. Declaring
# Phase 2's Ktor or Phase 4's LiveKit ahead of use is the "keep it for later"
# pattern HARNESS.md §3 dimension 5 rejects: unused dependencies are dead
# weight, they inflate the APK, and they make it impossible to tell which
# libraries the app really depends on. Add each one in the commit that first
# imports it.

[versions]
agp = "9.3.1"
kotlin = "2.4.10"
activityCompose = "1.13.0"
composeBom = "2026.06.01"

# test
junit = "4.13.2"
# 4.14+ is required: 4.13 caps at API 34 and refuses to run at all against a
# package with targetSdkVersion 35 ("targetSdkVersion=35 > maxSdkVersion=34").
robolectric = "4.16.1"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose — versions come from the BOM, so these carry no version.ref
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# test
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
